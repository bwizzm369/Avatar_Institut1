<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate — Avatar Institut</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#e8e6e0}
  a{color:#b08d3f}
  a:hover{color:#8a6d2c}
  .sheet{width:210mm;margin:0 auto;background:#fdfdfb}
  @page{size:A4;margin:0}
  @media print{
    html,body{background:#fdfdfb}
    .sheet{width:100%;margin:0}
  }
</style>
</head>
<body>
<div class="sheet">
  <div style="position:relative;width:100%;aspect-ratio:210 / 297;container-type:size;overflow:hidden;background:#fdfdfb;font-family:Quicksand, sans-serif;color:#2b2b2b;text-align:center">
    <img src="assets/frame.png" alt="" style="position:absolute;inset:0;width:100%;height:100%;z-index:0">
    <div style="position:absolute;top:19.2cqw;right:18.1cqw;bottom:19.2cqw;left:18.1cqw;background:#fdfdfb;z-index:1"></div>
    <div style="position:absolute;z-index:2;top:20.4cqw;left:50%;transform:translateX(-50%);width:19cqw;height:19cqw;border:1px dashed #c9bf9e;display:flex;align-items:center;justify-content:center;text-align:center;font-family:ui-monospace,monospace;font-size:1.1cqw;color:#9b9384;line-height:1.3;background:#fdfdfb">logo<br>Avatar Institut</div>

    <div style="position:absolute;z-index:2;top:42cqw;right:18.5cqw;bottom:18.5cqw;left:18.5cqw;display:flex;flex-direction:column;align-items:center">

      <div style="font-family:'Great Vibes', cursive;font-size:8cqw;line-height:1;color:#b08d3f">Certificate</div>

      <div style="font-size:2cqw;line-height:1.5;font-weight:500;margin-top:2.4cqw;white-space:nowrap">Avatar Institut für Metaphysik GmbH<br>certifies that</div>

      <div style="width:100%;display:flex;align-items:center;gap:1.9cqw;margin-top:2.6cqw">
        <div style="flex:1;height:1px;background:#c9c2b4"></div>
        <div style="width:1.4cqw;height:1.4cqw;background:#b08d3f;transform:rotate(45deg)"></div>
        <div style="flex:1;height:1px;background:#c9c2b4"></div>
      </div>

      <div style="width:88%;margin-top:2.2cqw;padding-bottom:0.8cqw;border-bottom:1px dotted #b9ac8e;min-height:4.6cqw;font-size:3.5cqw;line-height:1.2;font-weight:700;color:#b08d3f">[STUDENT_NAME]</div>
      <div style="font-size:1.5cqw;letter-spacing:0.12em;text-transform:uppercase;color:#9b9384;margin-top:1cqw">Certificate Holder</div>

      <div style="width:100%;display:flex;align-items:center;gap:1.9cqw;margin-top:2.4cqw">
        <div style="flex:1;height:1px;background:#c9c2b4"></div>
        <div style="width:1.4cqw;height:1.4cqw;background:#b08d3f;transform:rotate(45deg)"></div>
        <div style="flex:1;height:1px;background:#c9c2b4"></div>
      </div>

      <div style="font-size:2cqw;line-height:1.55;font-weight:500;margin-top:3cqw;width:100%">has successfully completed the programme</div>

      <div style="width:90%;margin-top:1.8cqw;padding-bottom:1.1cqw;border-bottom:1px dotted #b9ac8e;min-height:4cqw;font-size:3cqw;line-height:1.3;font-weight:700;color:#b08d3f">[COURSE_TITLE]</div>

      <div style="flex:1"></div>

      <div style="width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:3cqw">
        <div style="width:30%;text-align:center">
          <div style="height:6.5cqw;border-bottom:1px dotted #b9ac8e"></div>
          <div style="font-size:1.5cqw;margin-top:0.8cqw;font-weight:600">Director</div>
        </div>
        <div style="width:30%;text-align:center">
          <div style="height:6.5cqw;border-bottom:1px dotted #b9ac8e"></div>
          <div style="font-size:1.5cqw;margin-top:0.8cqw;font-weight:600">Official Seal</div>
        </div>
        <div style="width:24%;text-align:center">
          <div style="width:12cqw;height:12cqw;margin:0 auto;border:1px dashed #c9bf9e;display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:1.2cqw;color:#9b9384;background:#fff">[QR_CODE]</div>
          <div style="font-size:1.2cqw;margin-top:0.7cqw;color:#6d6d6d">Verify this certificate</div>
        </div>
      </div>

      <div style="width:100%;display:flex;align-items:flex-end;justify-content:space-between;margin-top:2.4cqw">
        <div style="font-size:1.7cqw;color:#5c5c5c;text-align:left">
          <div style="font-weight:600">Official number:</div>
          <div style="margin-top:0.7cqw;min-width:16cqw;border-bottom:1px dotted #b9ac8e;min-height:2.6cqw;color:#b08d3f;font-weight:700">[CERTIFICATE_NUMBER]</div>
        </div>
        <div style="font-size:1.7cqw;color:#5c5c5c;text-align:right">
          <div style="font-weight:600">Date of issue:</div>
          <div style="margin-top:0.7cqw;min-width:16cqw;border-bottom:1px dotted #b9ac8e;min-height:2.6cqw;font-weight:600">[ISSUE_DATE]</div>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
